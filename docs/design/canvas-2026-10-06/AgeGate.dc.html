<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Age check</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Lexend:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
.k-light{--bg:#FFFFFF;--surface:#F5F5F4;--field:#F7F7F6;--field-border:#E1E3E0;--border:#E7E7E4;--text:#141716;--text-2:#4B5250;--text-3:#646B69;--primary:#0F766E;--on-primary:#FFFFFF;--primary-soft:#E7F2F0;--primary-text:#0D5F58;--focus:rgba(15,118,110,0.16);--warn-soft:#FEF3C7;--warn-text:#92400E;--warn-icon:#D97706;--success:#15803D;--success-soft:#ECF6EF;--danger:#B91C1C;--danger-border:#DC2626;--danger-soft:#FEF2F2;--danger-title:#991B1B;--apple-bg:#000000;--apple-fg:#FFFFFF;--btn2-bg:#FFFFFF;--track:#E1E3E0;--chip:#FFFFFF;--shadow:rgba(20,23,22,0.08);--frame:rgba(20,23,22,0.12);--disabled-bg:#E1E3E0;--disabled-fg:#6F7674;--avatar-ink:#141716;--avatar-ink-fg:#FFFFFF;--splash:#0F766E;color-scheme:light}
.k-dark{--bg:#0E1111;--surface:#171B1B;--field:#171B1B;--field-border:#2C3332;--border:#262C2B;--text:#F1F4F3;--text-2:#B3BCB9;--text-3:#929B98;--primary:#14B8A6;--on-primary:#042F2C;--primary-soft:#10302C;--primary-text:#5EEAD4;--focus:rgba(20,184,166,0.25);--warn-soft:#2B2210;--warn-text:#FCD34D;--warn-icon:#F59E0B;--success:#4ADE80;--success-soft:#0F2918;--danger:#F87171;--danger-border:#EF4444;--danger-soft:#2A1414;--danger-title:#FECACA;--apple-bg:#FFFFFF;--apple-fg:#000000;--btn2-bg:#171B1B;--track:#2C3332;--chip:#1D2222;--shadow:rgba(0,0,0,0.45);--frame:rgba(255,255,255,0.10);--disabled-bg:#252B2A;--disabled-fg:#7D8684;--avatar-ink:#F1F4F3;--avatar-ink-fg:#0E1111;--splash:#0E1111;color-scheme:dark}
</style>
</helmet>
<div style="width: 860px; height: 844px; display: flex; gap: 80px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="{{t.cls}}" style="width: 390px; height: 844px; flex-shrink: 0; position: relative; overflow: hidden; border-radius: 44px; box-shadow: 0 0 0 1px var(--frame); background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif">
  <div style="position: absolute; top: 54px; left: 16px; right: 16px; height: 44px; display: flex; align-items: center; gap: 14px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div style="flex-grow: 1; display: flex; gap: 6px">
      <span style="flex-grow: 1; height: 4px; border-radius: 2px; background: var(--primary)"></span>
      <span style="flex-grow: 1; height: 4px; border-radius: 2px; background: var(--track)"></span>
      <span style="flex-grow: 1; height: 4px; border-radius: 2px; background: var(--track)"></span>
      <span style="flex-grow: 1; height: 4px; border-radius: 2px; background: var(--track)"></span>
    </div>
    <div style="width: 44px; text-align: right; font-size: 13px; font-weight: 600; color: var(--text-3)">1 of 4</div>
  </div>

  <div style="position: absolute; top: 126px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-family: Lexend, sans-serif; font-weight: 600; font-size: 28px; line-height: 34px; letter-spacing: -0.02em">When’s your birthday?</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--text-2)">Konvami is for learners aged 16 and over. We only use this to confirm your age.</p>
  </div>

  <div style="position: absolute; top: 256px; left: 24px; right: 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 600">Day</div>
      <div style="height: 52px; border-radius: 12px; border: 1px solid var(--field-border); background: var(--field); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">14</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 600">Month</div>
      <div style="height: 52px; border-radius: 12px; border: 1.5px solid var(--primary); background: var(--bg); box-shadow: 0 0 0 4px var(--focus); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">March</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 600">Year</div>
      <div style="height: 52px; border-radius: 12px; border: 1px solid var(--field-border); background: var(--field); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">1996</div>
    </div>
  </div>

  <div style="position: absolute; top: 366px; left: 24px; right: 24px; height: 210px; border-radius: 18px; background: var(--surface); overflow: hidden">
    <div style="position: absolute; top: 85px; left: 10px; right: 10px; height: 40px; border-radius: 10px; background: var(--bg); box-shadow: 0 0 0 1px var(--border)"></div>
    <div style="position: absolute; top: 5px; left: 10px; right: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <div style="display: flex; flex-direction: column; align-items: center">
        <div style="height: 40px; line-height: 40px; font-size: 16px; color: var(--text-3); opacity: 0.55">12</div>
        <div style="height: 40px; line-height: 40px; font-size: 18px; color: var(--text-3)">13</div>
        <div style="height: 40px; line-height: 40px; font-size: 20px; font-weight: 600; color: var(--text)">14</div>
        <div style="height: 40px; line-height: 40px; font-size: 18px; color: var(--text-3)">15</div>
        <div style="height: 40px; line-height: 40px; font-size: 16px; color: var(--text-3); opacity: 0.55">16</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center">
        <div style="height: 40px; line-height: 40px; font-size: 16px; color: var(--text-3); opacity: 0.55">January</div>
        <div style="height: 40px; line-height: 40px; font-size: 18px; color: var(--text-3)">February</div>
        <div style="height: 40px; line-height: 40px; font-size: 20px; font-weight: 600; color: var(--text)">March</div>
        <div style="height: 40px; line-height: 40px; font-size: 18px; color: var(--text-3)">April</div>
        <div style="height: 40px; line-height: 40px; font-size: 16px; color: var(--text-3); opacity: 0.55">May</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center">
        <div style="height: 40px; line-height: 40px; font-size: 16px; color: var(--text-3); opacity: 0.55">1994</div>
        <div style="height: 40px; line-height: 40px; font-size: 18px; color: var(--text-3)">1995</div>
        <div style="height: 40px; line-height: 40px; font-size: 20px; font-weight: 600; color: var(--text)">1996</div>
        <div style="height: 40px; line-height: 40px; font-size: 18px; color: var(--text-3)">1997</div>
        <div style="height: 40px; line-height: 40px; font-size: 16px; color: var(--text-3); opacity: 0.55">1998</div>
      </div>
    </div>
  </div>

  <div style="position: absolute; top: 600px; left: 24px; right: 24px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--primary-soft); color: var(--primary-text)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <div style="font-size: 14px; line-height: 20px">Private by default. Your personas never see your birthday.</div>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 42px">
    <button type="button" style="width: 100%; height: 54px; border: 0; border-radius: 14px; background: var(--primary); color: var(--on-primary); font-size: 17px; font-weight: 600">Continue</button>
  </div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":860,"height":844}}'>

  renderVals() {
    return {
      themes: [
        { cls: 'k-light', k: 'l', wordmark: '/_blob/79ad230f275d652bd63fcaf6ee753d52' },
        { cls: 'k-dark', k: 'd', wordmark: '/_blob/76c887908a86e37c4a4351e783071fb5' }
      ]
    };
  }
}
</script>
</body>
</html>
