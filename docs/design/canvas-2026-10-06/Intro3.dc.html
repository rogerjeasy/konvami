<!doctype html>

<style>

button,input{font-family:inherit}
.k-light{--bg:#FFFFFF;--surface:#F5F5F4;--field:#F7F7F6;--field-border:#E1E3E0;--border:#E7E7E4;--text:#141716;--text-2:#4B5250;--text-3:#646B69;--primary:#0F766E;--on-primary:#FFFFFF;--primary-soft:#E7F2F0;--primary-text:#0D5F58;--focus:rgba(15,118,110,0.16);--warn-soft:#FEF3C7;--warn-text:#92400E;--warn-icon:#D97706;--success:#15803D;--success-soft:#ECF6EF;--danger:#B91C1C;--danger-border:#DC2626;--danger-soft:#FEF2F2;--danger-title:#991B1B;--apple-bg:#000000;--apple-fg:#FFFFFF;--btn2-bg:#FFFFFF;--track:#E1E3E0;--chip:#FFFFFF;--shadow:rgba(20,23,22,0.08);--frame:rgba(20,23,22,0.12);--disabled-bg:#E1E3E0;--disabled-fg:#6F7674;--avatar-ink:#141716;--avatar-ink-fg:#FFFFFF;--splash:#0F766E;color-scheme:light}
.k-dark{--bg:#0E1111;--surface:#171B1B;--field:#171B1B;--field-border:#2C3332;--border:#262C2B;--text:#F1F4F3;--text-2:#B3BCB9;--text-3:#929B98;--primary:#14B8A6;--on-primary:#042F2C;--primary-soft:#10302C;--primary-text:#5EEAD4;--focus:rgba(20,184,166,0.25);--warn-soft:#2B2210;--warn-text:#FCD34D;--warn-icon:#F59E0B;--success:#4ADE80;--success-soft:#0F2918;--danger:#F87171;--danger-border:#EF4444;--danger-soft:#2A1414;--danger-title:#FECACA;--apple-bg:#FFFFFF;--apple-fg:#000000;--btn2-bg:#171B1B;--track:#2C3332;--chip:#1D2222;--shadow:rgba(0,0,0,0.45);--frame:rgba(255,255,255,0.10);--disabled-bg:#252B2A;--disabled-fg:#7D8684;--avatar-ink:#F1F4F3;--avatar-ink-fg:#0E1111;--splash:#0E1111;color-scheme:dark}
</style>
</helmet>
<div style="width: 860px; height: 844px; display: flex; gap: 80px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="{{t.cls}}" style="width: 390px; height: 844px; flex-shrink: 0; position: relative; overflow: hidden; border-radius: 44px; box-shadow: 0 0 0 1px var(--frame); background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif">
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 500px; background: var(--surface); border-radius: 0 0 32px 32px">
    <div style="position: absolute; top: 54px; right: 16px">
      <button type="button" style="height: 44px; padding: 0 14px; border: 0; background: transparent; color: var(--text-2); font-size: 16px; font-weight: 600">Skip</button>
    </div>

    <div style="position: absolute; top: 130px; left: 20px; right: 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="padding: 18px; background: var(--chip); border: 1px solid var(--border); border-radius: 20px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; align-items: center; gap: 16px">
          <div style="width: 88px; height: 88px; border-radius: 50%; background: conic-gradient(var(--primary) 0deg 245deg, var(--track) 245deg 360deg); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <div style="width: 72px; height: 72px; border-radius: 50%; background: var(--chip); display: flex; flex-direction: column; align-items: center; justify-content: center">
              <div style="font-family: Lexend, sans-serif; font-weight: 600; font-size: 22px; line-height: 24px">B1</div>
              <div style="font-size: 11px; color: var(--text-3)">68%</div>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
            <div style="font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: 0.06em; text-transform: uppercase">Your German</div>
            <div style="font-family: Lexend, sans-serif; font-weight: 600; font-size: 18px">On your way to B1</div>
            <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--warn-soft); color: var(--warn-text); font-size: 12.5px; font-weight: 600">
              <span style="color: var(--warn-icon); display: flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5 5 5.8 5 11a5 5 0 0 1-10 0c0-2.4 1.2-3.9 2.4-5 .2 1.6 1 2.6 2.1 3C11 8.5 11.3 5 12 2z"/></svg></span>
              12-day streak
            </span>
          </div>
        </div>
        <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; height: 64px">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; flex-grow: 1"><span style="width: 100%; height: 22px; border-radius: 5px; background: var(--primary-soft)"></span><span style="font-size: 10.5px; color: var(--text-3)">M</span></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; flex-grow: 1"><span style="width: 100%; height: 34px; border-radius: 5px; background: var(--primary-soft)"></span><span style="font-size: 10.5px; color: var(--text-3)">T</span></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; flex-grow: 1"><span style="width: 100%; height: 18px; border-radius: 5px; background: var(--primary-soft)"></span><span style="font-size: 10.5px; color: var(--text-3)">W</span></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; flex-grow: 1"><span style="width: 100%; height: 40px; border-radius: 5px; background: var(--primary-soft)"></span><span style="font-size: 10.5px; color: var(--text-3)">T</span></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; flex-grow: 1"><span style="width: 100%; height: 30px; border-radius: 5px; background: var(--primary-soft)"></span><span style="font-size: 10.5px; color: var(--text-3)">F</span></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; flex-grow: 1"><span style="width: 100%; height: 46px; border-radius: 5px; background: var(--primary)"></span><span style="font-size: 10.5px; font-weight: 700; color: var(--text)">S</span></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; flex-grow: 1"><span style="width: 100%; height: 6px; border-radius: 5px; background: var(--track)"></span><span style="font-size: 10.5px; color: var(--text-3)">S</span></div>
        </div>
      </div>

      <div style="display: flex; gap: 12px; padding: 14px; background: var(--chip); border: 1px solid var(--border); border-radius: 18px">
        <div style="width: 38px; height: 38px; border-radius: 50%; background: #0F766E; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-family: Lexend, sans-serif; font-weight: 600; font-size: 16px; flex-shrink: 0">L</div>
        <div style="display: flex; flex-direction: column; gap: 3px">
          <div style="font-size: 12px; font-weight: 600; color: var(--primary-text)">Lena remembers</div>
          <div style="font-size: 14.5px; line-height: 20px">Your sister’s wedding is in May. Want to practise your toast today?</div>
        </div>
      </div>
    </div>
  </div>

  <div style="position: absolute; top: 536px; left: 28px; right: 28px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; gap: 6px">
      <span style="width: 6px; height: 6px; border-radius: 3px; background: var(--track)"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: var(--track)"></span>
      <span style="width: 22px; height: 6px; border-radius: 3px; background: var(--primary)"></span>
    </div>
    <h1 style="margin: 4px 0 0; font-family: Lexend, sans-serif; font-weight: 600; font-size: 28px; line-height: 34px; letter-spacing: -0.02em">A buddy who remembers you</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--text-2)">Your partners recall your life and goals, and the level adapts as you grow.</p>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 42px">
    <button type="button" style="width: 100%; height: 54px; border: 0; border-radius: 14px; background: var(--primary); color: var(--on-primary); font-size: 17px; font-weight: 600">Get started</button>
  </div>
</div>
</sc-for>
</div>
